openapi: 3.1.0
info:
  title: Protocolo Vereda
  version: "1.0"
  description: |
    API abierta de la red Vereda. Es la interfaz principal del sistema: apps y agentes usan
    exactamente los mismos endpoints. Todo lo público (comercios, ofertas, búsqueda, rondas
    abiertas) va sin token. Todo lo que actúa en nombre de alguien lleva un token de sesión
    o un mandato de agente (OAuth 2.1). Los errores siguen esquemas/error.json y traen una
    frase en español que un agente puede repetirle a la persona.

    La sesión se consigue en /acceso, en la raíz del dominio y fuera de /v1 (docs/acceso.md).
    Con custodia propia —la forma de las apps nativas— se entra firmando un desafío con la
    clave Ed25519 del dispositivo: sin contraseña, sin alta que alguien apruebe. Con custodia
    del nodo, el nodo puede ofrecer además un código o enlace por email, WhatsApp o SMS. Qué
    ofrece cada nodo lo dice `acceso` en /.well-known/vereda.json. Un agente no entra por
    /acceso: actúa con un mandato.
  license: { name: CC0-1.0, url: https://creativecommons.org/publicdomain/zero/1.0/ }
servers:
  - url: https://{nodo}/v1
    variables: { nodo: { default: vereda.ar } }
tags:
  - { name: descubrimiento, description: "Nodo, versiones y federación" }
  - { name: acceso, description: "Entrar a un nodo: desafío firmado con la clave propia, o código por mensaje si el nodo custodia la clave (docs/acceso.md). Fuera de /v1" }
  - { name: comercios, description: Público }
  - { name: mi-comercio, description: "Lado comercio: su ficha, catálogo, promociones, pedidos, métricas y exportación. Nadie habilita un comercio: se crea y opera" }
  - { name: ofertas, description: Público }
  - { name: carrito, description: Armado paso a paso; valida y dice qué falta }
  - { name: pedidos }
  - { name: listas }
  - { name: suscripciones }
  - { name: rondas }
  - { name: grupos }
  - { name: cotizaciones }
  - { name: viajes, description: "Lado repartidor: alta sin aprobación, viajes, cobro del envío, historial y ganancias (docs/repartidores.md)" }
  - { name: mensajes }
  - { name: resenas }
  - { name: identidad, description: "Vinculaciones, atestaciones y denuncias de suplantación. Nadie verifica a nadie: todo se prueba y cualquiera lo recomprueba (docs/identidad-y-verificacion.md)" }
  - { name: mandatos, description: Agentes }
  - { name: yo, description: Preferencias y exportación }
  - { name: eventos }

paths:
  /.well-known/vereda.json:
    get:
      operationId: verNodo
      tags: [descubrimiento]
      summary: Identidad del nodo, versiones soportadas, clave pública, endpoints de federación
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Nodo" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }

  /acceso/desafio:
    servers: [ { url: "https://{nodo}", description: "En la raíz del dominio, fuera de /v1: es cómo se consigue la credencial de /v1, no parte de una versión de la API (docs/acceso.md).", variables: { nodo: { default: vereda.ar } } } ]
    post:
      operationId: pedirDesafio
      tags: [acceso]
      summary: "Custodia propia: pedir un desafío para una clave Ed25519. Responde igual para una clave conocida que para una nueva"
      description: |
        Primer paso de entrar con la clave del dispositivo (docs/acceso.md). El desafío es de un solo
        uso y vence a los pocos minutos (2 en el nodo de referencia). Lo sirve todo nodo que publica
        `acceso.custodia_propia: true` en /.well-known/vereda.json. Nunca por mandato: un agente no
        entra, recibe un mandato.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/pedido_desafio" } } } }
      responses:
        "201": { description: Desafío emitido, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/desafio" } } } }
        "422": { description: "La clave pública no es Ed25519 en base64url (cuerpo_invalido)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "429": { $ref: "#/components/responses/Reintentar" }
  /acceso/sesion:
    servers: [ { url: "https://{nodo}", variables: { nodo: { default: vereda.ar } } } ]
    post:
      operationId: abrirSesion
      tags: [acceso]
      summary: "Custodia propia: canjear el desafío firmado por un token de sesión. Si la clave es nueva, el usuario se crea en el acto"
      description: |
        Se firma el JCS de `{clave_publica, desafio, nodo}` (`esquemas/acceso.json#/$defs/prueba_de_clave`).
        Solo abre sesión la clave `activa` del historial del actor: una `retirada` responde
        `clave_rotada` y una `comprometida`, `clave_comprometida`. El resto de los rechazos
        (desafío inexistente, ya usado, vencido o emitido para otra clave) responde `no_autenticado`
        sin decir cuál fue. Una firma que no verifica no gasta el desafío; una que verifica lo
        gasta antes de emitir el token, de forma atómica.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/pedido_sesion" } } } }
      responses:
        "201": { description: Sesión abierta, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/sesion" } } } }
        "401": { description: "no_autenticado, firma_invalida, clave_rotada o clave_comprometida", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "422": { description: "Falta el desafío o la firma, o la clave no es Ed25519 (cuerpo_invalido)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "429": { $ref: "#/components/responses/Reintentar" }
    delete:
      operationId: cerrarSesion
      tags: [acceso]
      summary: Cerrar la sesión con la que se llama. La clave queda en el dispositivo
      security: [ { sesion: [] } ]
      responses:
        "204": { description: Cerrada; el token deja de valer en el acto }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "Un token de mandato: renovar y cerrar son de la persona", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /acceso/renovar:
    servers: [ { url: "https://{nodo}", variables: { nodo: { default: vereda.ar } } } ]
    post:
      operationId: renovarSesion
      tags: [acceso]
      summary: Cambiar el token por uno nuevo sin volver a firmar. El viejo deja de valer en el mismo momento
      security: [ { sesion: [] } ]
      responses:
        "200": { description: Renovada, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/renovacion" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "Un token de mandato: renovar y cerrar son de la persona", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /acceso/codigo:
    servers: [ { url: "https://{nodo}", variables: { nodo: { default: vereda.ar } } } ]
    post:
      operationId: pedirCodigoDeAcceso
      tags: [acceso]
      summary: "Opcional, custodia del nodo: mandar un código o enlace de acceso por email, WhatsApp o SMS"
      description: |
        Solo si el nodo lista el canal en `acceso.alternativo` de /.well-known/vereda.json; si no, 501
        `no_implementado`. El proveedor que manda el mensaje lo elige cada nodo. Responde 202 exista
        o no una cuenta con ese contacto: la ruta no sirve para averiguar quién tiene cuenta. El
        código vence a los 10 minutos y admite cinco intentos.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/pedido_codigo" } } } }
      responses:
        "202": { description: "Enviado (o no había nada que enviar: la respuesta es la misma)" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Reintentar" }
        "501": { description: "Este nodo no ofrece acceso alternativo por ese canal (no_implementado)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /acceso/codigo/canje:
    servers: [ { url: "https://{nodo}", variables: { nodo: { default: vereda.ar } } } ]
    post:
      operationId: canjearCodigoDeAcceso
      tags: [acceso]
      summary: "Opcional, custodia del nodo: canjear el código (o el del enlace) por una sesión. Si el contacto es nuevo, el usuario se crea con custodia del nodo"
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/canje_codigo" } } } }
      responses:
        "201": { description: Sesión abierta, content: { application/json: { schema: { $ref: "esquemas/acceso.json#/$defs/sesion" } } } }
        "401": { description: "Código vencido, gastado o incorrecto (no_autenticado)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Reintentar" }
        "501": { description: "Este nodo no ofrece acceso alternativo (no_implementado)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }

  /sostenimiento:
    get:
      operationId: verSostenimiento
      tags: [descubrimiento]
      summary: "Cómo se sostiene este nodo: cuenta, aporte sugerido, propinas, y lo que recibió y gastó por mes"
      description: |
        Público, sin token, y el mismo bloque que 'sostenimiento' en /.well-known/vereda.json. Sin
        comisión y sin plata en el medio: el comercio elige si aporta y cuánto, el comprador puede
        dejar una propina, y el nodo publica en qué se gasta (docs/sostenimiento.md).
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/sostenimiento.json" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }

  /zona/calles:
    get:
      operationId: verCallesDeLaZona
      tags: [descubrimiento]
      summary: "Las calles de la zona del nodo, para dibujar el mapa sin pedirle nada a un tercero"
      description: |
        Público, sin token y sin parámetros: el mismo archivo para todos, así pedirlo no dice dónde
        está nadie, ni siquiera al nodo. Un GeoJSON (RFC 7946) de líneas con tipo de vía y nombre,
        que el operador bajó una vez de OpenStreetMap y que se sirve con su atribución ODbL
        (docs/mapa.md). Chico y estable: la app lo guarda y revalida con `If-None-Match`. Un nodo
        que no tiene calles cargadas responde 404 `no_encontrado` y la app dibuja su cuadrícula de
        respaldo.
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/geo+json: { schema: { $ref: "esquemas/calles.json" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { description: "Este nodo no tiene calles cargadas (no_encontrado)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }

  /comercios:
    get:
      operationId: buscarComercios
      tags: [comercios]
      summary: Comercios que entregan en un punto, ordenados por el ranking público
      security: []
      parameters:
        - { $ref: "#/components/parameters/ifNoneMatch" }
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: tipo, in: query, schema: { type: string } }
        - { name: abierto, in: query, schema: { type: boolean }, description: "Filtra por `abierto_ahora`: horarios, o `apertura_manual` mientras esté vigente." }
        - { name: modalidad, in: query, schema: { type: string, enum: [inmediata, franja, consolidada, ronda, punto_entrega, retiro] } }
        - { name: orden, in: query, schema: { type: string, enum: [ranking, distancia, precio, reputacion], default: ranking } }
        - { name: q, in: query, schema: { type: string }, description: "Texto libre, también semántico" }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/comercio.json" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: crearComercio
      tags: [mi-comercio]
      summary: Dar de alta un comercio. Queda activo al instante, sin aprobación de nadie
      description: |
        No hay gatekeeper: ni el operador del nodo ni ninguna autoridad habilita comercios. El dueño
        es la sesión que lo crea. El nodo fija `identidad`, `id`, `verificacion` y `reputacion`: lo
        que venga en esos campos se ignora. `verificacion` arranca toda en false y se completa sola
        cuando el comercio verifica CUIT, foto geolocalizada y cuenta de cobro; no es una
        habilitación y no hace falta para vender. La reputación se construye solo con reseñas
        firmadas de pedidos entregados.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/comercio.json" } } } }
      responses:
        "201": { description: Creado y activo, content: { application/json: { schema: { $ref: "esquemas/comercio.json" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}:
    get: { operationId: verComercio, tags: [comercios], summary: Un comercio, security: [], parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/comercio.json" } } } }, "304": { $ref: "#/components/responses/SinCambios" } } }
    patch:
      operationId: editarComercio
      tags: [mi-comercio]
      summary: "Editar la ficha: horarios, modalidades, políticas, medios de cobro, política de datos"
      description: |
        Solo el dueño, o un agente con su mandato `administrar`. Los campos que no vienen quedan como
        están. El nodo valida el documento resultante contra
        esquemas/comercio.json. `identidad`, `verificacion`, `reputacion` y `abierto_ahora` no se editan.

        "Abierto ahora" es `apertura_manual`: `{"abierto": false, "hasta": "..."}` cierra ya aunque
        los horarios digan abierto; `{"abierto": true}` abre fuera de horario. Sin `hasta` dura hasta
        que el comercio la cambie o la quite (`"apertura_manual": null`), y con `hasta` en el pasado el
        nodo la ignora y vuelven a mandar los horarios. Si cambia `abierto_ahora`, el nodo emite
        `comercio.abierto` o `comercio.cerrado`.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: "Los campos a cambiar, con la forma de esquemas/comercio.json." } } } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "esquemas/comercio.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/reputacion:
    get:
      operationId: verReputacion
      tags: [resenas]
      summary: "Reputación contextual del comercio, con el desglose de cómo se calculó"
      description: |
        La fórmula entera está en `docs/resenas.md` y los números de esta respuesta alcanzan para
        rehacerla a mano. Cada reseña pesa `w = c · v · r · k · f`: cercanía de la zona habitual del
        autor al comercio, afinidad con quien mira, cuántas veces ese autor volvió a comprarle,
        antigüedad y diversidad de su identidad, y las señales anti campaña.

        Sin sesión devuelve el desglose global y se cachea para todos. Con sesión agrega `para_vos`
        —el mismo cálculo con el factor `v` activo— y responde `Cache-Control: private`. No son dos
        algoritmos: sin sesión `v` vale 0,7 para todas las reseñas y se cancela al normalizar.

        Va aparte de `verComercio` para no ensuciar el caché de la ficha, que es pública y la
        operación más pedida del nodo. `esquemas/comercio.json` sigue trayendo el número y la
        cantidad en `reputacion` para que un listado no tenga que pedir N desgloses.

        Las reseñas que no computan —del dueño, de identidades vinculadas, o marcadas por ráfaga—
        siguen publicadas y visibles en `listarResenasDeActor` con su marca. Acá se cuentan, no se
        esconden.
      security: [ {}, { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/resena.json#/$defs/reputacion_contextual" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { description: No hay comercio con ese id }
  /comercios/{id}/ofertas:
    get:
      operationId: listarOfertas
      tags: [ofertas]
      summary: Catálogo completo con stock y precios
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" }, { name: categoria, in: query, schema: { type: string } } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/oferta.json" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: crearOferta
      tags: [mi-comercio]
      summary: Publicar una oferta del catálogo
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/oferta.json" } } } }
      responses:
        "201": { description: Publicada, content: { application/json: { schema: { $ref: "esquemas/oferta.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/ofertas/{oferta}:
    patch:
      operationId: editarOferta
      tags: [mi-comercio]
      summary: "Editar una oferta: precio, opciones, variantes, disponibilidad, atributos"
      description: Solo el dueño. Los campos que no vienen quedan como están; el nodo valida el documento resultante contra esquemas/oferta.json. Para cambiar solo stock y precio de muchas a la vez está PUT /comercios/{id}/stock.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: oferta, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: "Los campos a cambiar, con la forma de esquemas/oferta.json." } } } }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "esquemas/oferta.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /ofertas/{id}:
    get:
      operationId: verOferta
      tags: [ofertas]
      summary: "Una oferta sola, por su id: precio, opciones, variantes, disponibilidad y modalidades"
      description: |
        Lo que tiene a mano una app o un agente después de una búsqueda es el `oferta_id`, no el
        comercio: esta lectura no lo pide. Devuelve la oferta tal como está ahora, también si está
        pausada o sin stock (`disponibilidad` lo dice), igual que `listarOfertas`. Solo las ofertas
        de comercios de este nodo; una de otro nodo se lee en el nodo de su comercio.
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/oferta.json" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { $ref: "#/components/responses/Error" }
  /comercios/{id}/promociones:
    get:
      operationId: listarPromociones
      tags: [ofertas]
      summary: Promociones activas del comercio. Se calculan con el algoritmo público de docs/promociones.md
      security: []
      parameters: [ { $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/promocion.json" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: crearPromocion
      tags: [mi-comercio]
      summary: Crear una promoción. Se calcula con el algoritmo público de docs/promociones.md
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/promocion.json" } } } }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "esquemas/promocion.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/promociones/{promocion}:
    patch:
      operationId: editarPromocion
      tags: [mi-comercio]
      summary: "Editar una promoción: vigencia, tramos, tope, activarla o pausarla"
      description: "Solo el dueño. Los campos que no vienen quedan como están; el nodo valida el documento resultante contra esquemas/promocion.json. Una promoción que ya se aplicó a un pedido no cambia ese pedido: los precios se congelan al crearlo."
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: promocion, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: "Los campos a cambiar, con la forma de esquemas/promocion.json." } } } }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "esquemas/promocion.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/stock:
    put:
      operationId: actualizarStock
      tags: [ofertas]
      summary: Actualización de stock en lote (supermercados con sistema)
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: array, items: { type: object, required: [oferta_id], properties: { oferta_id: { type: string }, variante_id: { type: string }, stock: { type: number }, disponible: { type: boolean }, precio_centavos: { type: integer } } } } } } }
      responses: { "204": { description: Aplicado }, "403": { $ref: "#/components/responses/NoEsElDueno" } }

  /comercios/{id}/pedidos:
    get:
      operationId: listarPedidosDelComercio
      tags: [mi-comercio]
      summary: Los pedidos del comercio, del más nuevo al más viejo
      description: |
        Solo el dueño. Es la bandeja de trabajo: se filtra por estado y por fecha de creación.
        Paginado por cursor opaco: se pide con `limite` y, si hay más, la respuesta trae
        `cursor_siguiente` para la página que sigue. El cursor no es un número de página y no se
        construye a mano; un cursor vencido o ajeno responde 422. Cada pedido trae `partes` con la
        misma regla que `verPedido`: el nombre del comprador solo en los activos, o en los
        terminados si aceptó la lista de clientes del comercio.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: estado, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false, description: "Uno o varios estados de esquemas/pedido.json (pagado,aceptado). Ausente: todos." }
        - { name: desde, in: query, schema: { type: string, format: date-time }, description: "Creados desde este instante, inclusive" }
        - { name: hasta, in: query, schema: { type: string, format: date-time }, description: "Creados hasta este instante, exclusive" }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: El `cursor_siguiente` de la página anterior }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginaDePedidos" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/metricas:
    get:
      operationId: metricasDelComercio
      tags: [mi-comercio]
      summary: "Agregados del comercio por período: visitas, apariciones en búsqueda, pedidos, conversión y ticket promedio"
      description: |
        Solo el dueño. Son conteos de eventos, nunca de personas: no traen identidad, id de usuario
        ni dirección, y no hay forma de pedir quién visitó la ficha. Un nodo que no puede agregar
        sin identificar no publica la métrica.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - { name: granularidad, in: query, schema: { type: string, enum: [dia, semana, mes, total], default: dia } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/comercio.json#/$defs/metricas" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/exportar:
    get:
      operationId: exportarComercio
      tags: [mi-comercio]
      summary: "Todo lo del comercio, firmado: ficha, catálogo, promociones, stock, pedidos, reseñas recibidas y métricas"
      description: |
        Solo el dueño. Mismo espíritu que GET /yo/exportar: los datos de su operación son del
        comercio y se los lleva enteros, para mudarse de nodo, tener respaldo o usarlos en su propio
        sistema. Va firmado con la clave del nodo, así el destino lo verifica. Lo que el comercio
        hace con esos datos fuera del nodo es su responsabilidad, incluida la legal (Ley 25.326).
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: Paquete firmado, content: { application/json: { schema: { $ref: "#/components/schemas/ExportacionComercio" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
  /comercios/{id}/aporte:
    get:
      operationId: verAporteComercio
      tags: [mi-comercio]
      summary: "Lo que el comercio eligió aportar al nodo, lo que el nodo sugiere, y sus aportes pendientes y recibidos"
      description: |
        Solo el dueño. El aporte es voluntario y no cambia nada: ni ranking, ni acceso, ni
        visibilidad (docs/sostenimiento.md). Los pagos son los 'aporte_nodo' de este comercio,
        con las instrucciones para transferir a la cuenta del nodo.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AporteComercio" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
    put:
      operationId: configurarAporte
      tags: [mi-comercio]
      summary: "Elegir cómo aportar al nodo: ninguno, por pedido entregado o mensual, y cuánto"
      description: |
        Queda público en la ficha, en 'aporte_nodo'. Nadie lo aprueba. Pasar a 'ninguno' corta
        los aportes que vengan; los ya generados quedan como estaban y vencen solos sin
        consecuencia. Con 'por_pedido', el monto se congela en el reparto de cada pedido nuevo.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/comercio.json#/properties/aporte_nodo" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AporteComercio" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/aporte/transferencia:
    post:
      operationId: declararTransferenciaAporte
      tags: [mi-comercio]
      summary: "El comercio declara que transfirió un aporte al nodo. No lo confirma: lo confirma el operador del nodo al verlo en su cuenta"
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pago_id], properties: { pago_id: { $ref: "esquemas/comunes.json#/$defs/id" }, comprobante: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: El pago con la transferencia declarada, content: { application/json: { schema: { $ref: "esquemas/pago.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /comercios/{id}/reclamos:
    get:
      operationId: listarReclamos
      tags: [identidad]
      summary: "Reclamos de propiedad sobre una ficha: quién reclama, con qué prueba y en qué quedó"
      security: []
      parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/reclamo.json" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: reclamarComercio
      tags: [identidad]
      summary: "Reclamar una ficha existente como propia. Se resuelve solo cuando el reclamante prueba lo que el dueño actual no probó; si no, vence solo a los 30 días"
      description: |
        Sin revisor, humano o agente (`docs/identidad-y-verificacion.md`, punto 6). La prueba es un
        QR propio del reclamo en la ubicación de la ficha (`local`), o una vinculación que la ficha ya
        declara y que el dueño actual no tiene verificada; cualquier otra: 422 `prueba_no_admitida`.
        Un reclamo abierto por reclamante y ficha: 409 `reclamo_abierto`. Nunca por mandato: cambia
        de manos un comercio.

        Si se resuelve, la ficha pasa a la clave del reclamante: la clave anterior queda `retirada`,
        la nueva lleva `reclamo` en el historial, se revocan los mandatos del dueño anterior y todo
        lo firmado antes sigue valiendo.
      security: [ { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/reclamo.json" } } } }
      responses:
        "201": { description: Abierto, content: { application/json: { schema: { $ref: "#/components/schemas/ReclamoAbierto" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /comercios/{id}/reclamos/{reclamo}/comprobar:
    post:
      operationId: comprobarReclamo
      tags: [identidad]
      summary: "El reclamante pide comprobar su prueba ahora. En 'whatsapp', con el código del desafío. Si prueba, se resuelve en el acto"
      security: [ { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: reclamo, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { codigo: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses:
        "200": { description: "Comprobado. Sin prueba no es un error: 'senales.motivo' dice qué faltó", content: { application/json: { schema: { $ref: "esquemas/reclamo.json" } } } }
        "403": { description: No es el reclamante, content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /catalogo/{ean}:
    get:
      operationId: verProductoDeCatalogo
      tags: [ofertas]
      summary: La versión que este nodo tiene de un producto por EAN. Cada nodo publica la suya; no hay una copia central ni merge automático
      security: []
      parameters: [ { name: ean, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8,14}$" } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/catalogo-maestro.json" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { description: Este nodo no tiene ese EAN }
  /buscar:
    get:
      operationId: buscarOfertas
      tags: [ofertas]
      summary: Búsqueda de ofertas entre comercios cercanos, por texto, atributos o EAN
      description: |
        Para agentes y para la app. "leche sin lactosa cerca", "algo liviano sin gluten", ean=7790742001009.
        Sin `q` ni `ean` trae todas las ofertas disponibles de los comercios que llegan al punto: con
        `con_video=true` es el feed en video del barrio, en el mismo orden público (docs/ranking-y-despacho.md).
        Paginado por cursor opaco, como `listarPedidosDelComercio`: se pide con `limite` y, si hay más, la
        respuesta trae `cursor_siguiente`. El cursor fija la consulta (punto, filtros y orden): las páginas que
        siguen salen del mismo orden que la primera. Un cursor vencido, ajeno o de otra consulta responde 422.
        Los resultados con `con_video=true` no suman `apariciones_busqueda` en las métricas del comercio.
      security: []
      parameters:
        - { $ref: "#/components/parameters/ifNoneMatch" }
        - { name: q, in: query, schema: { type: string } }
        - { name: ean, in: query, schema: { type: string } }
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: atributos, in: query, schema: { type: string }, description: "sin_tacc=true,refrigerado=false" }
        - { name: orden, in: query, schema: { type: string, enum: [ranking, distancia, precio, reputacion], default: ranking } }
        - { name: con_video, in: query, schema: { type: boolean, default: false }, description: "Solo ofertas con al menos un clip en `videos`" }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: El `cursor_siguiente` de la página anterior }
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "#/components/schemas/PaginaDeResultados" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "422": { $ref: "#/components/responses/Error" }

  /carritos:
    post:
      operationId: crearCarrito
      tags: [carrito]
      summary: Crear un carrito (a un comercio) o desde una lista (se resuelve contra comercios)
      security: [ { sesion: [] }, { mandato: [armar] } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { comercio_id: { type: string }, lista_id: { type: string }, direccion: { $ref: "esquemas/comunes.json#/$defs/direccion" } } } } } }
      responses: { "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Carrito" } } } } }
  /carritos/{id}/items:
    post:
      operationId: agregarItemCarrito
      tags: [carrito]
      summary: Agregar un ítem. Responde válido, incompleto (qué falta) o no disponible.
      security: [ { sesion: [] }, { mandato: [armar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { $ref: "esquemas/carrito.json#/$defs/item_entrada" } } } }
      responses:
        "200": { description: Estado del carrito, content: { application/json: { schema: { $ref: "#/components/schemas/Carrito" } } } }
        "410": { $ref: "#/components/responses/CarritoVencido" }
        "422": { $ref: "#/components/responses/Error" }
  /carritos/{id}/items/{item}:
    delete: { operationId: quitarItemCarrito, tags: [carrito], summary: Quitar ítem, security: [ { sesion: [] }, { mandato: [armar] } ], parameters: [ { $ref: "#/components/parameters/id" }, { name: item, in: path, required: true, schema: { type: string } } ], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Carrito" } } } }, "410": { $ref: "#/components/responses/CarritoVencido" } } }
  /carritos/{id}/resolver:
    post:
      operationId: resolverCarrito
      tags: [carrito]
      summary: Para listas con ítems genéricos, devuelve combinaciones posibles (un comercio o dividido) con precio, distancia y hora
      security: [ { sesion: [] }, { mandato: [armar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "200": { description: Opciones, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Resolucion" } } } } }, "410": { $ref: "#/components/responses/CarritoVencido" } }
  /carritos/{id}/modalidad:
    put:
      operationId: elegirModalidadCarrito
      tags: [carrito]
      summary: Elegir modalidad, dirección, franja, ronda o grupo
      security: [ { sesion: [] }, { mandato: [armar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { $ref: "esquemas/pedido.json#/properties/modalidad" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Carrito" } } } }, "410": { $ref: "#/components/responses/CarritoVencido" } }
  /carritos/{id}/puntos:
    put:
      operationId: canjearPuntosCarrito
      tags: [carrito]
      summary: Elegir cuántos puntos del comercio canjear en este carrito. 0 para no canjear.
      security: [ { sesion: [] }, { mandato: [armar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [canjear], properties: { canjear: { type: integer, minimum: 0 } } } } } }
      responses: { "200": { description: Estado del carrito, content: { application/json: { schema: { $ref: "#/components/schemas/Carrito" } } } }, "410": { $ref: "#/components/responses/CarritoVencido" }, "422": { $ref: "#/components/responses/Error" } }
  /carritos/{id}/confirmar:
    post:
      operationId: confirmarCarrito
      tags: [carrito]
      summary: Crea el pedido, reserva stock y cupos hasta que venza el cobro, y devuelve la referencia de cobro. Si excede el mandato, requiere_confirmacion.
      security: [ { sesion: [] }, { mandato: [pedir] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/idem" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { propina_repartidor_centavos: { type: integer }, propina_comercio_centavos: { type: integer }, propina_nodo_centavos: { type: integer, minimum: 0, description: "Propina opcional del comprador al nodo (docs/sostenimiento.md). Solo si el nodo publica 'acepta_propinas_de_usuarios'; si no, 422 propina_nodo_no_aceptada. Se paga siempre por transferencia a la cuenta del nodo, aparte del pedido, aunque el pedido sea en efectivo; si no se paga, no pasa nada." }, notas: { type: string }, repartidor: { $ref: "esquemas/comunes.json#/$defs/identidad", description: "El repartidor de confianza que nombra el comprador (docs/repartidores.md). Si el comercio tiene 'usuario' en envios.asignacion se le ofrece en ese turno; si no, queda como propuesta que el comercio acepta o no. Lo contrata el comprador: el envío se le paga a él." }, monto_envio_acordado_centavos: { type: integer, minimum: 0, description: "Solo con 'repartidor': lo que el comprador y el repartidor arreglaron entre ellos por el envío. Ausente: rige 'tarifa_envio', la pública. El repartidor lo ve en viaje.pago_repartidor antes de aceptar (docs/repartidores.md)." }, metodo_pago: { type: string, enum: [efectivo, transferencia], description: "Cómo paga el comprador los productos, entre los medios_cobro del comercio (docs/carrito-y-reserva.md, elegir cómo pagar). Ausente: el que elige el comercio, efectivo primero si lo acepta para esa modalidad. Un medio que el comercio no acepta es 422 con detalle.medios_cobro; efectivo que el comprador no puede usar (efectivo.pedidos_entregados_minimo, efectivo.modalidades, efectivo.monto_maximo) es 422 efectivo_no_disponible." }, metodo_envio: { type: string, enum: [efectivo, transferencia], description: "Cómo se paga el envío cuando va directo al repartidor. El despacho solo lo ofrece a repartidores que aceptan ese medio. Ausente: efectivo si el pedido es en efectivo, si no transferencia." }, acepta_lista_de_clientes: { type: boolean, default: false, description: "Consentimiento para que este comercio guarde nombre y contacto más allá del pedido, si su política 'datos.lista_de_clientes' lo declara. Se pregunta una sola vez por comercio y se puede decir que no: el pedido sale igual. Sin este campo en true el nodo no entrega esos datos al comercio pasado el pedido activo." } } } } } }
      responses:
        "201": { description: Pedido creado, content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "402": { description: Fuera de mandato; trae confirmación, content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "409": { description: "Stock o cupo agotado entre el armado y la confirmación (oferta_no_disponible, cupo_agotado). No se crea el pedido; el carrito queda no_disponible.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "410": { $ref: "#/components/responses/CarritoVencido" }
        "422": { description: "El repartidor nombrado no acepta que lo elija un comprador (repartidor_no_acepta), o no existe. O una propina al nodo que el nodo no acepta (propina_nodo_no_aceptada). O un metodo_pago que el comercio no acepta: efectivo_no_disponible si es efectivo, medio_no_disponible si es otro, los dos con detalle.medios_cobro, los que sí acepta. O efectivo que el comprador no puede usar con las condiciones del comercio (efectivo_no_disponible).", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }

  /pedidos/{id}:
    get:
      operationId: verPedido
      tags: [pedidos]
      summary: "Estado, ítems, ETA, ubicación del repartidor"
      description: |
        Mientras el pedido está `en_camino`, trae `ubicacion_repartidor`: la última que reportó
        el repartidor con `reportarUbicacion`, la misma que sale en el evento
        `pedido.ubicacion_repartidor`. Así quien abre el pedido a mitad del viaje ve dónde está sin
        esperar el próximo evento. Solo la ven las partes del pedido y solo en `en_camino`; antes y
        después no sale (docs/datos-y-privacidad.md). Si el repartidor todavía no reportó ninguna,
        no viene.

        Trae `partes`: cómo se llama cada parte, para mostrar. El nombre del comprador lo ven él, el
        comercio y el repartidor mientras el pedido está activo; terminado, el comprador siempre y
        el comercio solo con lista de clientes aceptada. Fuera de eso la parte viene sin `nombre`.

        El agente del comercio lo lee con `administrar`, el mismo scope con que lo atiende: solo
        los pedidos de los comercios de la persona que le dio el mandato.
      security: [ { sesion: [] }, { mandato: [leer] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } } }
  /pedidos/{id}/items/{item}/respuesta:
    post:
      operationId: responderSustitucion
      tags: [pedidos]
      summary: Aceptar o rechazar una sustitución propuesta
      security: [ { sesion: [] }, { mandato: [hablar] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: item, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [respuesta], properties: { respuesta: { type: string, enum: [aceptado, rechazado] } } } } } }
      responses: { "200": { description: OK } }
  /pedidos/{id}/cancelar:
    post:
      operationId: cancelarPedido
      tags: [pedidos]
      summary: Cancelar según la política publicada por el comercio
      security: [ { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { motivo: { type: string } } } } } }
      responses: { "200": { description: Cancelado }, "409": { $ref: "#/components/responses/Error" } }
  /pedidos/{id}/propina:
    post:
      operationId: agregarPropina
      tags: [pedidos]
      summary: Agregar propina después de la entrega, al repartidor, al comercio o al nodo
      security: [ { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [destinatario, centavos], properties: { destinatario: { type: string, enum: [repartidor, comercio, nodo], description: "'nodo': solo si el nodo acepta propinas, por transferencia a su cuenta (docs/sostenimiento.md)." }, centavos: { type: integer } } } } } }
      responses: { "201": { description: Cobro generado, content: { application/json: { schema: { $ref: "esquemas/pago.json" } } } } }
  /pedidos/{id}/aceptar:
    post:
      operationId: aceptarPedido
      tags: [pedidos]
      summary: "Comercio: aceptar, opcionalmente diciendo en cuánto lo tiene listo"
      description: |
        `tiempo_preparacion_min` son los minutos de preparación de ESTE pedido ("Aceptar · 25 min").
        Ausente: los `tiempo_preparacion_min` de la ficha del comercio, o 0 si no los publica. El
        nodo los guarda en el pedido y fija `eta`: el instante de aceptación más esos minutos, más la
        ruta si hay envío (`docs/ranking-y-despacho.md`). Es lo que ve el comprador y lo que el
        despacho respeta. Fuera de rango: 422 `documento_invalido`.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { tiempo_preparacion_min: { type: integer, minimum: 0, maximum: 1440, description: "Minutos de preparación de este pedido. Pisa los de la ficha solo para él." } } } } } }
      responses: { "200": { description: "Pedido aceptado, con su eta", content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }, "403": { $ref: "#/components/responses/NoEsElDueno" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /pedidos/{id}/rechazar:
    post: { operationId: rechazarPedido, tags: [pedidos], summary: "Comercio: rechazar (antes de aceptar)", security: [ { sesion: [] }, { mandato: [administrar] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /pedidos/{id}/items/{item}:
    patch:
      operationId: resolverItemPedido
      tags: [pedidos]
      summary: "Comercio: marcar ítem confirmado, sustituido (propone), faltante o pesado"
      description: |
        El primer ítem que resuelve el comercio en un pedido `aceptado` lo pasa a `preparando`, en
        la misma operación, y el nodo publica `pedido.preparando` además del `item.*`. Así el
        comprador y el local ven que empezó a prepararse sin un paso aparte. Los ítems siguientes
        no mueven el estado.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: item, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [estado], properties: { estado: { type: string, enum: [confirmado, sustituido, faltante, pesado] }, sustituto: { type: object }, cantidad_entregada: { $ref: "esquemas/comunes.json#/$defs/cantidad" } } } } } }
      responses: { "200": { description: OK } }
  /pedidos/{id}/listo:
    post: { operationId: marcarPedidoListo, tags: [pedidos], summary: "Comercio: listo para retirar. Requiere todos los ítems resueltos.", security: [ { sesion: [] }, { mandato: [administrar] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } } }
  /pedidos/{id}/asignar:
    post:
      operationId: asignarRepartidor
      tags: [pedidos]
      summary: "Comercio: decidir, para este pedido, quién lo lleva: él mismo, un propio, el pool o el repartidor que propuso el comprador"
      description: |
        Pisa `envios.asignacion` solo para este pedido. Sirve para aceptar la propuesta del
        comprador cuando el comercio no tiene `usuario` en su orden, para relanzar tras
        `pedido.sin_repartidor`, o para llevarlo él (`modo: comercio`, sin viaje: entrega el
        comercio con `entregar`). Mientras el pedido no esté `en_camino`.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [modo], properties: { modo: { type: string, enum: [comercio, propio, usuario, pool] }, repartidor: { $ref: "esquemas/comunes.json#/$defs/identidad", description: "Con modo 'propio': a cuál de los propios se le ofrece solo a él. Ausente: a todos." } } } } } }
      responses: { "200": { description: Pedido con su asignación, content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }, "403": { $ref: "#/components/responses/NoEsElDueno" }, "409": { $ref: "#/components/responses/Error" } }
  /pedidos/{id}/retirar:
    post:
      operationId: retirarPedido
      tags: [pedidos]
      summary: "Repartidor: retiró del comercio. Firma el traspaso (firmas.retiro)"
      description: |
        Con repartidor elegido por el comprador, esta firma es hasta dónde responde el comercio
        (docs/repartidores.md). Si el comercio le paga el envío en efectivo al retirar
        (`cobro_envio: al_comercio` o envío bonificado), el repartidor lo marca acá.

        La firma es la del repartidor sobre `pedido.json#/$defs/traspaso` con `accion: retiro`
        (docs/repartidores.md, punto j). Con la clave en el teléfono la manda en `firma`; si el
        nodo custodia la clave y no viene, firma el nodo. Con sesión y custodia propia, sin
        `firma` responde 422 `firma_requerida` y el pedido no se mueve.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { cobrado_en_mano: { type: boolean, description: "El pago de envío en efectivo cuyo pagador es el comercio pasa a confirmado." }, firma: { $ref: "#/components/schemas/FirmaTraspaso" } } } } } }
      responses:
        "200": { description: "Pedido retirado, con firmas.retiro", content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "422": { description: "firma_requerida, firma_invalida, clave_desconocida o clave_comprometida", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /pedidos/{id}/entregar:
    post:
      operationId: entregarPedido
      tags: [pedidos]
      summary: "Repartidor, o comercio en modalidad retiro: entregado. Firma la entrega. En retiro exige el código del usuario; con efectivo marca el cobro en mano; con alcohol, mayoría de edad verificada."
      description: |
        Con repartidor, la firma de la entrega es la suya sobre `pedido.json#/$defs/traspaso` con
        `accion: entrega`, con las mismas reglas que `retirarPedido`: la manda en `firma` si la
        clave vive en el teléfono, la pone el nodo si la custodia, y con sesión y custodia propia
        sin `firma` responde 422 `firma_requerida` sin entregar. En modalidad retiro entrega el
        comercio y la prueba es el código del comprador.
      security: [ { sesion: [] }, { mandato: [administrar] }, { mandato: [repartir] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { mayoria_edad_verificada: { type: boolean }, foto: { type: string, format: uri }, codigo_retiro: { type: string, description: "Obligatorio en modalidad retiro. Si no coincide, 422 codigo_retiro_invalido." }, cobrado_en_mano: { type: boolean, description: "Obligatorio si hay pagos en_mano. Pasa a confirmado todos los que cobra quien entrega: productos y envío en efectivo, y la propina en mano." }, firma: { $ref: "#/components/schemas/FirmaTraspaso" } } } } } }
      responses:
        "200": { description: "Pedido entregado, con firmas.entrega", content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "422": { description: "codigo_retiro_invalido, cobro_en_mano_sin_confirmar, mayoria_edad_no_verificada, firma_requerida, firma_invalida, clave_desconocida o clave_comprometida", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /pedidos/{id}/transferencia:
    post:
      operationId: declararTransferencia
      tags: [pedidos]
      summary: "Quien paga: declara que ya transfirió. No confirma el cobro (docs/carrito-y-reserva.md, transferencia directa)"
      description: "Lo usa el comprador, y también el comercio cuando es el pagador del envío (docs/repartidores.md). Con 'concepto' se dice cuál de los pagos del pedido."
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { concepto: { type: string, enum: [productos, envio, propina_repartidor, propina_nodo], default: productos, description: "Qué pago del pedido. 'envio' y 'propina_repartidor' van al repartidor (docs/repartidores.md); 'propina_nodo', al nodo (docs/sostenimiento.md)." }, comprobante: { type: string, maxLength: 500, description: "Número de operación o una nota corta. El nodo no guarda archivos." }, titular_coincide: { type: boolean, description: "Si el titular que le mostró su banco al transferir coincide con 'pago.instrucciones.titular'. El nodo guarda solo este veredicto, y cuenta para la vinculación 'cuenta_cobro' del destinatario (docs/identidad-y-verificacion.md). Ausente: la persona no dijo." } } } } } }
      responses:
        "200": { description: Pedido con la transferencia declarada, content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /pedidos/{id}/transferencia/confirmar:
    post:
      operationId: confirmarTransferencia
      tags: [pedidos]
      summary: "El destinatario del pago confirma que vio la plata en su cuenta ('recibido'). Es lo único que pasa ese cobro a confirmado"
      description: |
        Solo el destinatario del pago que dice `concepto`: el comercio para `productos` (y el
        pedido pasa a pagado), el repartidor para `envio` y `propina_repartidor`. Cualquier otro
        recibe 403 no_es_el_destinatario. Es el único que puede: es el único que ve su cuenta.
      security: [ { sesion: [] }, { mandato: [administrar] }, { mandato: [repartir] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { concepto: { type: string, enum: [productos, envio, propina_repartidor], default: productos, description: "Qué pago del pedido. 'envio' y 'propina_repartidor' van al repartidor (docs/repartidores.md)." } } } } } }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200": { description: Pedido con el cobro confirmado, content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
  /pedidos/{id}/rendicion:
    post:
      operationId: declararRendicion
      tags: [pedidos]
      summary: "Repartidor: declara, firmado, cuánto efectivo le dio al comercio ('te rendí $X')"
      description: |
        Agrega una constancia `rendida` a `pedido.rendicion` (docs/repartidores.md, punto l). Solo
        el repartidor del pedido: cualquier otro recibe 403. Con `rendicion.modo` `al_retirar` se
        puede desde que aceptó el viaje; con `despues_de_entregar`, desde que el pedido está
        `entregado` (antes, 409 `rendicion_antes_de_tiempo`). Sin rendición en el pedido, 409
        `rendicion_no_aplica`; ya `confirmada`, 409 `rendicion_confirmada`.

        La firma es la del repartidor sobre `pedido.json#/$defs/constancia_rendicion` con
        `accion: rendida`, con las reglas del traspaso (punto j): la manda en `firma` si la clave
        vive en su teléfono; si el nodo la custodia y no viene, firma el nodo; con sesión y
        custodia propia, sin `firma` responde 422 `firma_requerida` y no agrega nada; por mandato
        queda sin firma. Emite `rendicion.declarada` al comercio y al repartidor.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConstanciaRendicion" } } } }
      responses:
        "200": { description: "Pedido con la constancia en rendicion.constancias", content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "rendicion_no_aplica, rendicion_antes_de_tiempo o rendicion_confirmada", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "422": { description: "firma_requerida, firma_invalida, clave_desconocida, clave_comprometida o un monto en otra moneda", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /pedidos/{id}/rendicion/confirmar:
    post:
      operationId: confirmarRendicion
      tags: [pedidos]
      summary: "Comercio: confirma, firmado, cuánto efectivo recibió del repartidor ('recibí $X')"
      description: |
        Agrega una constancia `recibida` a `pedido.rendicion` (docs/repartidores.md, punto l),
        firmada con la clave del comercio. Solo quien administra el comercio del pedido. Si el
        monto es el de la última `rendida`, la rendición queda `confirmada` (evento
        `rendicion.confirmada`); si no, `en_desacuerdo` (evento `rendicion.en_desacuerdo`), las
        dos versiones firmadas y a la vista, y cualquiera de los dos puede agregar otra. Sin una
        `rendida` antes, 409 `rendicion_sin_declarar`. La firma sigue las mismas reglas que
        `declararRendicion`, con la clave del comercio.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConstanciaRendicion" } } } }
      responses:
        "200": { description: "Pedido con la constancia en rendicion.constancias", content: { application/json: { schema: { $ref: "esquemas/pedido.json" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "rendicion_no_aplica, rendicion_sin_declarar o rendicion_confirmada", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "422": { description: "firma_requerida, firma_invalida, clave_desconocida, clave_comprometida o un monto en otra moneda", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }

  /listas:
    get: { operationId: listarListas, tags: [listas], summary: Mis listas, security: [ { sesion: [] }, { mandato: [leer] } ], responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/lista.json" } } } } } } }
    post: { operationId: crearLista, tags: [listas], summary: Crear lista, security: [ { sesion: [] }, { mandato: [armar] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/lista.json" } } } }, responses: { "201": { description: Creada } } }
  /listas/{id}:
    patch: { operationId: editarLista, tags: [listas], summary: Editar ítems o compartir, security: [ { sesion: [] }, { mandato: [armar] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }

  /suscripciones:
    get: { operationId: listarSuscripciones, tags: [suscripciones], summary: Mis suscripciones (usuario) o mi cartera (comercio), security: [ { sesion: [] }, { mandato: [leer] } ], responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/suscripcion.json" } } } } } } }
    post: { operationId: crearSuscripcion, tags: [suscripciones], summary: Crear. Siempre requiere confirmación humana si la crea un agente., security: [ { sesion: [] }, { mandato: [suscribir] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/suscripcion.json" } } } }, responses: { "201": { description: Creada }, "402": { $ref: "#/components/responses/Error" } } }
  /suscripciones/{id}:
    patch: { operationId: editarSuscripcion, tags: [suscripciones], summary: "Pausar, reanudar, cancelar o editar la plantilla", security: [ { sesion: [] }, { mandato: [suscribir] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /suscripciones/{id}/ocurrencias/{fecha}:
    patch:
      operationId: editarOcurrencia
      tags: [suscripciones]
      summary: Editar o saltear una ocurrencia dentro de su ventana
      security: [ { sesion: [] }, { mandato: [suscribir] } ]
      parameters: [ { $ref: "#/components/parameters/id" }, { name: fecha, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { saltear: { type: boolean }, items: { type: array } } } } } }
      responses: { "200": { description: OK } }

  /rondas:
    get: { operationId: buscarRondas, tags: [rondas], summary: Rondas abiertas cerca de un punto, security: [], parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { name: lat, in: query, schema: { type: number } }, { name: lng, in: query, schema: { type: number } } ], responses: { "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/ronda.json" } } } } }, "304": { $ref: "#/components/responses/SinCambios" } } }
    post: { operationId: crearRonda, tags: [rondas], summary: Crear una ronda (comercio o usuario que reúne vecinos), security: [ { sesion: [] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/ronda.json" } } } }, responses: { "201": { description: Creada } } }
  /rondas/{id}:
    get: { operationId: verRonda, tags: [rondas], summary: Una ronda (por id o por link), security: [], parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/ronda.json" } } } }, "304": { $ref: "#/components/responses/SinCambios" } } }

  /grupos:
    post: { operationId: crearGrupo, tags: [grupos], summary: Crear pedido grupal (carrito abierto con link), security: [ { sesion: [] }, { mandato: [armar] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/grupo.json" } } } }, responses: { "201": { description: Creado } } }
  /grupos/{id}:
    get: { operationId: verGrupo, tags: [grupos], summary: Ver grupo, security: [ { sesion: [] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/grupo.json" } } } } } }
  /grupos/{id}/unirse:
    post: { operationId: unirseAGrupo, tags: [grupos], summary: Sumarse con el link, security: [ { sesion: [] }, { mandato: [armar] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /grupos/{id}/mis-items:
    put: { operationId: editarMisItemsGrupo, tags: [grupos], summary: Mis ítems dentro del grupo, security: [ { sesion: [] }, { mandato: [armar] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /grupos/{id}/cerrar:
    post: { operationId: cerrarGrupo, tags: [grupos], summary: "Cerrar: genera el pedido con secciones por persona y un cobro por participante", security: [ { sesion: [] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "201": { description: Pedido generado } } }

  /cotizaciones:
    post: { operationId: pedirCotizacion, tags: [cotizaciones], summary: Pedir presupuesto por una oferta a cotizar, security: [ { sesion: [] }, { mandato: [armar] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/cotizacion.json" } } } }, responses: { "201": { description: Solicitada } } }
  /cotizaciones/{id}/presupuesto:
    put: { operationId: presupuestarCotizacion, tags: [cotizaciones], summary: "Comercio: responder con presupuesto firmado", security: [ { sesion: [] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /cotizaciones/{id}/aceptar:
    post: { operationId: aceptarCotizacion, tags: [cotizaciones], summary: Aceptar el presupuesto; crea el pedido con precio fijo, security: [ { sesion: [] }, { mandato: [pedir] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "201": { description: Pedido creado } } }

  /viajes/ofrecidos:
    get: { operationId: listarViajesOfrecidos, tags: [viajes], summary: "Repartidor: viajes que se me ofrecen, con monto, distancia, peso, paradas y, por pedido, quién me paga, cuánto y por qué medio (pago_repartidor.por_pedido[].cobros), y cuánto efectivo le voy a deber al comercio y cuándo se lo doy (por_pedido[].rendicion). Del pool, solo los que caen enteros en mi zona y respetan mi vehículo, caja térmica, capacidad y medios de cobro", security: [ { sesion: [] }, { mandato: [repartir] } ], responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/viaje.json" } } } } } } }
  /viajes/{id}:
    get:
      operationId: verViaje
      tags: [viajes]
      summary: "Un viaje entero: paradas, ETA, peso, monto y cómo se cobra el envío"
      description: |
        Para releer un viaje después de aceptarlo sin haberlo guardado. Es el mismo documento que
        `listarViajesOfrecidos` y `listarMisViajes`, con todas sus paradas.

        Lo ven solo quienes tienen algo que ver con el viaje:
        - su repartidor, en cualquier estado (aceptado, en curso, completado o soltado por él);
        - el repartidor a quien se le está ofreciendo, mientras la oferta sigue en pie y no la rechazó;
        - el dueño de un comercio con algún pedido en el viaje.

        El comprador no: sigue su pedido con `GET /pedidos/{id}` (estado, ETA, ubicación del
        repartidor), y un viaje puede llevar direcciones de otros compradores
        (`docs/datos-y-privacidad.md`). Con mandato, 'repartir' lo lee solo como repartidor y
        'administrar' solo como comercio. A cualquier otro el nodo responde 404, igual que si el
        viaje no existiera.
      security: [ { sesion: [] }, { mandato: [repartir] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/viaje.json" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /viajes/{id}/aceptar:
    post: { operationId: aceptarViaje, tags: [viajes], summary: "Repartidor: aceptar. Rechazar no penaliza.", security: [ { sesion: [] }, { mandato: [repartir] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK }, "409": { description: Ya asignado } } }
  /viajes/{id}/rechazar:
    post: { operationId: rechazarViaje, tags: [viajes], summary: "Repartidor: pasar. No cuenta en ningún lado", security: [ { sesion: [] }, { mandato: [repartir] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: OK } } }
  /viajes/{id}/soltar:
    post:
      operationId: soltarViaje
      tags: [viajes]
      summary: "Repartidor: dejar un viaje ya aceptado. Vuelve a asignarse y cuenta en mi reputación (docs/repartidores.md)"
      description: |
        Rechazar una oferta no cuenta; soltar un viaje aceptado sí, y se ve en el perfil público
        (`viajes_soltados`, y aparte `soltados_con_pedido_retirado` si ya tenía la mercadería).
        Con mercadería en la mano, el repartidor sigue siendo quien la tiene hasta que otro la
        retira de él o la devuelve al comercio: soltar no la hace desaparecer del historial.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { motivo: { type: string, maxLength: 300 } } } } } }
      responses: { "200": { description: Soltado, content: { application/json: { schema: { $ref: "esquemas/viaje.json" } } } }, "409": { $ref: "#/components/responses/Error" } }
  /repartidor:
    get: { operationId: verMiRepartidor, tags: [viajes], summary: "Mi perfil de repartidor entero, con lo privado", security: [ { sesion: [] }, { mandato: [repartir] } ], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/repartidor.json" } } } }, "404": { description: "Esta identidad todavía no se declaró repartidor" } } }
    put:
      operationId: declararRepartidor
      tags: [viajes]
      summary: "Alta y edición del repartidor: vehículo, restricciones, zona, cobro, cooperativa. Sin aprobación: reparte al instante"
      description: |
        Cualquier identidad con sesión se declara repartidor. No hay revisión, ni screening, ni
        datos que cargue un tercero: el nodo lo crea al instante, con `verificacion` en false y
        `disponible: false`. Reemplaza la declaración entera; lo que no se manda se borra.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/repartidor.json#/$defs/declaracion" } } } }
      responses: { "200": { description: Perfil actualizado, content: { application/json: { schema: { $ref: "esquemas/repartidor.json" } } } }, "201": { description: Alta, content: { application/json: { schema: { $ref: "esquemas/repartidor.json" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /repartidor/disponibilidad:
    put: { operationId: fijarDisponibilidad, tags: [viajes], summary: Disponible o no, security: [ { sesion: [] }, { mandato: [repartir] } ], requestBody: { content: { application/json: { schema: { type: object, properties: { disponible: { type: boolean } } } } } }, responses: { "204": { description: OK } } }
  /repartidor/ubicacion:
    put: { operationId: reportarUbicacion, tags: [viajes], summary: Ubicación cada 5 s mientras hay viaje activo, security: [ { sesion: [] }, { mandato: [repartir] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/punto" } } } }, responses: { "204": { description: OK } } }
  /repartidor/viajes:
    get:
      operationId: listarMisViajes
      tags: [viajes]
      summary: "Mis viajes, del más nuevo al más viejo: estado, monto, distancia, paradas y fecha"
      description: |
        Paginado por cursor opaco, igual que la bandeja del comercio: `limite` y, si hay más,
        `cursor_siguiente`. Un cursor vencido o ajeno responde 422. Incluye los soltados; no
        incluye las ofertas rechazadas, que no dejan rastro.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      parameters:
        - { name: estado, in: query, schema: { type: array, items: { type: string, enum: [aceptado, en_curso, completado, soltado] } }, style: form, explode: false, description: "Uno o varios. Ausente: todos." }
        - { name: desde, in: query, schema: { type: string, format: date-time }, description: "Aceptados desde este instante, inclusive" }
        - { name: hasta, in: query, schema: { type: string, format: date-time }, description: "Aceptados hasta este instante, exclusive" }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: El `cursor_siguiente` de la página anterior }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaginaDeViajes" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /repartidor/ganancias:
    get:
      operationId: verMisGanancias
      tags: [viajes]
      summary: "Lo que cobré por período: envíos y propinas confirmados, por medio, y lo que quedó sin marcar recibido"
      description: |
        Agregados de los pagos cuyo destinatario soy yo. El nodo no guarda nada nuevo para esto y
        solo cuenta como cobrado lo que está `confirmado`: la plata nunca pasó por el nodo.
      security: [ { sesion: [] }, { mandato: [repartir] } ]
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - { name: granularidad, in: query, schema: { type: string, enum: [dia, semana, mes, total], default: semana } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/repartidor.json#/$defs/ganancias" } } } }
  /repartidores/{identidad}:
    get:
      operationId: verRepartidor
      tags: [viajes]
      summary: "Perfil público de un repartidor: nombre, vehículo, cooperativa, medios de cobro, verificaciones y reputación"
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/repartidor.json#/$defs/publico" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { $ref: "#/components/responses/Error" }

  /mensajes:
    post:
      operationId: enviarMensaje
      tags: [mensajes]
      summary: Enviar mensaje en el contexto de un pedido, cotización, suscripción, grupo o ronda
      description: Texto libre o estructurado (propuesta / aceptar / rechazar). Un agente de voz entra por acá con origen voz_transcripta.
      security: [ { sesion: [] }, { mandato: [hablar] } ]
      requestBody: { content: { application/json: { schema: { $ref: "esquemas/mensaje.json" } } } }
      responses: { "201": { description: Enviado } }
    get:
      operationId: listarMensajes
      tags: [mensajes]
      summary: Mensajes de un contexto
      security: [ { sesion: [] }, { mandato: [leer] } ]
      parameters: [ { name: contexto_tipo, in: query, required: true, schema: { type: string } }, { name: contexto_id, in: query, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/mensaje.json" } } } } } }

  /resenas:
    post: { operationId: crearResena, tags: [resenas], summary: "Reseñar un pedido entregado (dentro de 7 días de la entrega, una por par)", security: [ { sesion: [] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/resena.json" } } } }, responses: { "201": { description: Publicada }, "409": { description: Ya reseñado o pedido no entregado } } }
  /resenas/{id}/respuesta:
    post:
      operationId: responderResena
      tags: [resenas]
      summary: Responder públicamente una reseña
      description: |
        Con sesión responde el reseñado, o quien administra el comercio reseñado. Con mandato
        `administrar` responde el agente del comercio, solo por un comercio que administra quien le
        dio el mandato: la respuesta la firma el nodo con la clave que custodia del comercio, como
        cuando responde la persona, y lleva `via` con `canal: agente` y el `mandato_id`, dentro de lo
        firmado. Escribir una reseña sigue siendo solo de la persona (`crearResena`, sesión).
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "201": { description: OK }, "403": { $ref: "#/components/responses/Error" } }
  /actores/{identidad}/claves:
    get:
      operationId: listarClavesDeActor
      tags: [descubrimiento]
      summary: Historial de claves públicas de un actor de este nodo. Con esto se verifica cualquier firma suya, nueva o vieja
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/claves" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/mudanza:
    get:
      operationId: verMudanzaDeActor
      tags: [descubrimiento]
      summary: Si este actor se mudó a otro nodo, la declaración firmada por él. La publican el nodo nuevo y, si coopera, también el viejo
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/mudanza" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { description: "No se mudó, o este nodo no sabe" }
  /actores/{identidad}/resenas:
    get: { operationId: listarResenasDeActor, tags: [resenas], summary: "Reseñas públicas de un comercio, repartidor o usuario", security: [], parameters: [ { $ref: "#/components/parameters/ifNoneMatch" }, { name: identidad, in: path, required: true, schema: { type: string } } ], responses: { "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/resena.json" } } } } }, "304": { $ref: "#/components/responses/SinCambios" } } }

  /actores/{identidad}/verificacion:
    get:
      operationId: verVerificacion
      tags: [identidad]
      summary: "Todo lo que distingue a un actor de quien se hace pasar por él: vinculaciones, vinculados, mismo nombre cerca, denuncias e historial, firmado por su nodo"
      description: |
        No es un sello: son pruebas y hechos que cualquiera puede rehacer (`docs/identidad-y-verificacion.md`).
        Las declaraciones adentro van firmadas por el actor y el documento entero por el nodo, así
        otro nodo lo puede guardar y verificar sin volver a preguntar.
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/verificacion_de_actor" } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
        "404": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/vinculaciones:
    post:
      operationId: declararVinculacion
      tags: [identidad]
      summary: "Declarar una vinculación: un dominio, un sitio, un Instagram, un WhatsApp, un local o la cuenta de cobro. Devuelve el texto a publicar"
      description: |
        Solo el propio actor, o el dueño si el actor es un comercio suyo; cualquier otro recibe 403
        `no_es_el_dueno`. Queda `pendiente` hasta que el nodo encuentra la prueba, y `vencida` a los
        7 días sin prueba. Con custodia del nodo alcanza con `tipo` y `valor`: el nodo arma y firma la
        declaración. Con custodia propia se manda `vinculacion` ya firmada.

        En `local`, la respuesta trae `qr` con el secreto adentro, **una sola vez**: el nodo no lo
        vuelve a mostrar. En `cuenta_cobro` no hay nada que publicar: la prueba son los veredictos de
        los compradores (`titular_coincide` en `declararTransferencia`). Un tipo que este nodo no sabe
        comprobar (ver `vinculaciones` en `/.well-known/vereda.json`) responde 422
        `vinculacion_no_soportada`.
      security: [ { sesion: [] }, { mandato: [administrar] }, { mandato: [repartir] } ]
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo: { $ref: "esquemas/comunes.json#/$defs/tipo_vinculacion" }
                valor: { type: string, maxLength: 253 }
                vinculacion: { $ref: "esquemas/comunes.json#/$defs/vinculacion", description: "Solo con custodia propia: la declaración ya firmada por el actor." }
      responses:
        "201": { description: Declarada, content: { application/json: { schema: { $ref: "#/components/schemas/VinculacionDeclarada" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "422": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/vinculaciones/{id}/comprobar:
    post:
      operationId: comprobarVinculacion
      tags: [identidad]
      summary: "Comprobar ahora una vinculación, sin esperar la recomprobación de cada 7 días. En 'whatsapp', con el código del desafío"
      description: "Mismos permisos que `declararVinculacion`. Responde 200 con la vinculación y su estado nuevo aunque la prueba no aparezca: no encontrarla no es un error, es un resultado, y `senales.motivo` dice qué faltó."
      security: [ { sesion: [] }, { mandato: [administrar] }, { mandato: [repartir] } ]
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { codigo: { type: string, pattern: "^[0-9]{6}$", description: "Solo 'whatsapp': el código que el nodo mandó a ese número." } } } } } }
      responses:
        "200": { description: Comprobada, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/vinculacion" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "404": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/atestaciones:
    get:
      operationId: listarAtestaciones
      tags: [identidad]
      summary: "Atestaciones visibles sobre un actor: presencias en su local o, si es una persona, comercios que la atestiguan como clienta y que ella aceptó publicar"
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/comunes.json#/$defs/atestacion" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: atestiguar
      tags: [identidad]
      summary: "Atestiguar sobre un actor: 'estuve acá' con el QR de su local, o, desde un comercio, 'es cliente frecuente'"
      description: |
        `presencia`: una persona con sesión, con la `prueba` que sale del QR. Prueba que no corresponde
        al QR vigente de esa vinculación: 422 `prueba_invalida`. Una por autor por vinculación: 409
        `atestacion_repetida`.

        `cliente_frecuente`: el comercio (su dueño con sesión, o mandato `administrar`) sobre una
        persona con 3 o más pedidos entregados en él; si no, 422 `sin_pedidos_suficientes`. Queda con
        `visible: false` hasta que la persona la acepta.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/atestacion" } } } }
      responses:
        "201": { description: Registrada, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/atestacion" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/denuncias:
    get:
      operationId: listarDenuncias
      tags: [identidad]
      summary: "Denuncias de suplantación contra un actor, con su respuesta y el estado que les calcula el nodo"
      security: []
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ifNoneMatch" } ]
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/denuncia.json" } } } } }
        "304": { $ref: "#/components/responses/SinCambios" }
    post:
      operationId: denunciarSuplantacion
      tags: [identidad]
      summary: "Denunciar que este actor se hace pasar por otro, diciendo qué vinculación prueba quién es el verdadero. Pública y firmada; nunca por mandato"
      description: |
        Nadie la acepta ni la rechaza, y no mueve ranking, reputación ni despacho. Su estado sale de
        la evidencia (`docs/identidad-y-verificacion.md`, punto 5). Una por par denunciante–denunciado:
        409 `denuncia_repetida`. `suplantado` igual a `denunciado`: 422.
      security: [ { sesion: [] } ]
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/denuncia.json" } } } }
      responses:
        "201": { description: Publicada, content: { application/json: { schema: { $ref: "esquemas/denuncia.json" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /actores/{identidad}/denuncias/{id}/respuesta:
    post:
      operationId: responderDenuncia
      tags: [identidad]
      summary: "El denunciado responde una denuncia, una sola vez, en público y firmado"
      security: [ { sesion: [] }, { mandato: [administrar] }, { mandato: [repartir] } ]
      parameters: [ { name: identidad, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [texto], properties: { texto: { type: string, minLength: 1, maxLength: 1000 }, firma: { $ref: "esquemas/comunes.json#/$defs/firma", description: "Solo con custodia propia." } } } } } }
      responses:
        "201": { description: Respondida, content: { application/json: { schema: { $ref: "esquemas/denuncia.json" } } } }
        "403": { $ref: "#/components/responses/NoEsElDueno" }
        "409": { description: Ya respondida }

  /mandatos:
    get: { operationId: listarMandatos, tags: [mandatos], summary: Mis mandatos activos, security: [ { sesion: [] } ], responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "esquemas/mandato.json" } } } } } } }
    post: { operationId: otorgarMandato, tags: [mandatos], summary: Otorgar mandato a un agente (fin del flujo OAuth), security: [ { sesion: [] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/mandato.json" } } } }, responses: { "201": { description: Otorgado } } }
  /mandatos/{id}/revocar:
    post: { operationId: revocarMandato, tags: [mandatos], summary: Revocar en un toque, security: [ { sesion: [] } ], parameters: [ { $ref: "#/components/parameters/id" } ], responses: { "200": { description: Revocado } } }
  /confirmaciones/{codigo}:
    post: { operationId: aprobarConfirmacion, tags: [mandatos], summary: La persona aprueba una acción del agente que excedía el mandato, security: [ { sesion: [] } ], parameters: [ { name: codigo, in: path, required: true, schema: { type: string } } ], responses: { "200": { description: Aprobada; la acción se ejecuta } } }

  /yo:
    get: { operationId: verPerfil, tags: [yo], summary: Mi perfil y preferencias, security: [ { sesion: [] }, { mandato: [leer] } ], responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/usuario.json" } } } } } }
  /yo/comercios:
    get:
      operationId: listarMisComercios
      tags: [mi-comercio]
      summary: "Los comercios que administro, con un resumen de cada uno. Vacío: no administro ninguno"
      description: |
        Administra un comercio su dueño: la identidad cuya sesión lo dio de alta (`crearComercio`),
        o la del reclamante si un reclamo de propiedad se resolvió a su favor
        (`docs/identidad-y-verificacion.md`, punto 6). Es la misma identidad a la que las
        operaciones del lado comercio responden 403 `no_es_el_dueno` si no coincide. Suele ser una
        persona, distinta de la identidad del comercio (`comercio.json#/identidad`, su dirección en
        la red); si un nodo da de alta un comercio que se administra a sí mismo, esa identidad lo
        ve acá como cualquier dueño.

        Sirve para que una app o un agente sepa, sin adivinar ni guardar nada propio, desde qué
        fichas puede operar la persona que entró: un teléfono que restaura la clave de la dueña ve
        sus comercios aunque no los haya creado él. Es la contraparte de `verMiRepartidor`, pero
        como alguien puede administrar varios comercios devuelve una lista, y no administrar
        ninguno es `200` con `[]`, no `404`.

        Un token de mandato `administrar` ve los mismos comercios que su otorgante: el mandato
        actúa en su nombre. Orden: del alta más vieja a la más nueva.
      security: [ { sesion: [] }, { mandato: [administrar] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MiComercio" } } } } }
  /yo/preferencias:
    put: { operationId: guardarPreferencias, tags: [yo], summary: Preferencias declarativas que cualquier agente autorizado lee, security: [ { sesion: [] } ], requestBody: { content: { application/json: { schema: { $ref: "esquemas/usuario.json#/$defs/preferencias" } } } }, responses: { "204": { description: OK } } }
  /yo/nombre:
    put:
      operationId: guardarNombre
      tags: [yo]
      summary: "Mi nombre para mostrar: el que ven el comercio y el repartidor de mis pedidos activos"
      description: |
        El nombre con el que la persona aparece en `partes.usuario` de sus pedidos
        (`esquemas/pedido.json`): '#4821 · Juan' en la bandeja del comercio, a quién le lleva el
        repartidor. Lo elige ella y puede ser solo el de pila; no se verifica contra nada. Se manda
        recortado de espacios, entre 1 y 80 caracteres; vacío o más largo es `422`. `null` lo
        borra y la persona queda sin nombre: en sus pedidos la parte sale sin `nombre`, nunca con
        el handle de la identidad. Solo por sesión, como las direcciones: un agente no cambia cómo
        se llama alguien.
      security: [ { sesion: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre], additionalProperties: false, properties: { nombre: { type: [string, "null"], maxLength: 80 } } } } } }
      responses:
        "200": { description: Guardado, content: { application/json: { schema: { type: object, properties: { nombre: { type: string } }, description: "El nombre como quedó guardado. Sin 'nombre' si se borró." } } } }
        "422": { $ref: "#/components/responses/Error" }
  /yo/direcciones:
    get:
      operationId: listarDirecciones
      tags: [yo]
      summary: "Mis direcciones guardadas. Al agente, solo sus etiquetas"
      description: |
        Con sesión, la lista entera, como la guardó `guardarDirecciones`. Con mandato `leer`, solo
        las etiquetas (`[{ "etiqueta": "casa" }, …]`), sin calle, altura ni punto: con eso el agente
        nombra una dirección en `carrito_crear` o `carrito_modalidad` (`direccion_etiqueta`) y el
        nodo pone la dirección exacta del lado del servidor. Las direcciones sin etiqueta no se le
        muestran al agente (`docs/datos-y-privacidad.md`).
      security: [ { sesion: [] }, { mandato: [leer] } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - { $ref: "esquemas/comunes.json#/$defs/direccion" }
                    - { type: object, required: [etiqueta], additionalProperties: false, properties: { etiqueta: { type: string } }, description: "Lo que ve un agente: solo la etiqueta." }
    put:
      operationId: guardarDirecciones
      tags: [yo]
      summary: "Mis direcciones guardadas ('casa', 'trabajo'). Reemplaza la lista entera y la devuelve"
      description: |
        Lo que no se manda se borra; una lista vacía las borra todas. Las etiquetas no se repiten
        (422 si se repiten): son lo que usan `preferencias.direccion_habitual` y
        `direccion_etiqueta` al crear un carrito o elegir su modalidad. Escribirlas es solo por sesión:
        la dirección exacta la ven el comercio y el repartidor de un pedido activo, no un agente, que
        solo lee las etiquetas (`listarDirecciones`, `docs/datos-y-privacidad.md`).
      security: [ { sesion: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "esquemas/usuario.json#/$defs/direcciones" } } } }
      responses:
        "200": { description: Guardadas, content: { application/json: { schema: { $ref: "esquemas/usuario.json#/$defs/direcciones" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /yo/puntos:
    get: { operationId: listarMisPuntos, tags: [yo], summary: "Mis saldos de puntos, uno por comercio, cada uno firmado por su comercio", security: [ { sesion: [] }, { mandato: [leer] } ], responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SaldoPuntos" } } } } } } }
  /yo/claves/rotar:
    post:
      operationId: rotarClave
      tags: [yo]
      summary: Rotar mi clave. La anterior queda retirada y avala a la nueva. Nunca por mandato
      security: [ { sesion: [] } ]
      requestBody: { content: { application/json: { schema: { type: object, description: "Vacío si el nodo custodia la clave. Con custodia propia, la entrada nueva ya avalada.", properties: { clave: { $ref: "esquemas/comunes.json#/$defs/clave" } } } } } }
      responses: { "200": { description: Historial actualizado, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/claves" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /yo/claves/comprometida:
    post:
      operationId: declararClaveComprometida
      tags: [yo]
      summary: Declarar comprometida una clave mía desde un instante, y rotar. Nunca por mandato
      security: [ { sesion: [] } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [clave_publica, comprometida_desde], properties: { clave_publica: { type: string }, comprometida_desde: { $ref: "esquemas/comunes.json#/$defs/instante" }, clave: { $ref: "esquemas/comunes.json#/$defs/clave", description: "La entrada que la reemplaza, sin aval. Obligatoria con custodia propia; con custodia del nodo, si falta la genera el nodo." } } } } } }
      responses: { "200": { description: Historial actualizado, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/claves" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /yo/atestaciones/{id}/consentimiento:
    post:
      operationId: consentirAtestacion
      tags: [identidad]
      summary: "Aceptar o rechazar que se publique un 'cliente frecuente' que un comercio firmó sobre mí"
      description: "Solo la persona atestiguada, con sesión. Si acepta, pasa a `visible: true`. Si rechaza, no se publica nunca."
      security: [ { sesion: [] } ]
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [acepta], properties: { acepta: { type: boolean } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "esquemas/comunes.json#/$defs/atestacion" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /yo/contacto:
    post:
      operationId: pedirConfirmacionDeContacto
      tags: [identidad]
      summary: "Mandar un código de 6 dígitos para confirmar un teléfono o un email. El nodo guarda solo un hash del valor"
      security: [ { sesion: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [canal, valor], properties: { canal: { type: string, enum: [telefono, email] }, valor: { type: string, maxLength: 254 }, via: { type: string, enum: [sms, whatsapp, email], description: "Por dónde mandar el código. Default: 'sms' para teléfono, 'email' para email." } } } } } }
      responses:
        "202": { description: "Código enviado. Vence a los 10 minutos" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Reintentar" }
  /yo/contacto/confirmar:
    post:
      operationId: confirmarContacto
      tags: [identidad]
      summary: "Devolver el código recibido. Cinco intentos; después hay que pedir otro"
      security: [ { sesion: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [canal, codigo], properties: { canal: { type: string, enum: [telefono, email] }, codigo: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses:
        "200": { description: Confirmado, content: { application/json: { schema: { $ref: "esquemas/usuario.json" } } } }
        "422": { description: "Código vencido o incorrecto (codigo_de_contacto_invalido)", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
  /yo/exportar:
    get: { operationId: exportarCuenta, tags: [yo], summary: "Todo lo mío, firmado: identidad, clave, historial, reseñas. Para irme a otro nodo.", security: [ { sesion: [] } ], responses: { "200": { description: Paquete firmado, content: { application/json: { schema: { type: object } } } } } }
  /yo/borrar:
    post: { operationId: borrarCuenta, tags: [yo], summary: Borrar mi cuenta y datos personales (las reseñas firmadas quedan anonimizadas), security: [ { sesion: [] } ], responses: { "202": { description: En proceso } } }

  /eventos:
    get:
      operationId: escucharEventos
      tags: [eventos]
      summary: Stream SSE de eventos de mis entidades
      security: [ { sesion: [] }, { mandato: [leer] } ]
      parameters: [ { name: desde, in: query, schema: { type: string }, description: Último id de evento visto } ]
      responses: { "200": { description: text/event-stream de esquemas/evento.json } }
  /webhooks:
    post:
      operationId: registrarWebhook
      tags: [eventos]
      summary: Registrar webhook (agentes, PSP, sistemas del comercio). Firmado con la clave del nodo; reintentos exponenciales 24 h.
      security: [ { sesion: [] }, { mandato: [leer] } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [url, tipos], properties: { url: { type: string, format: uri }, tipos: { type: array, items: { type: string } }, secreto: { type: string } } } } } }
      responses: { "201": { description: Registrado } }

  /federacion/entrantes:
    post:
      operationId: recibirFederacion
      tags: [descubrimiento]
      summary: Otro nodo entrega un pedido, mensaje o evento firmado. Idempotente por el id del evento; reintentos y versiones en docs/federacion.md
      security: [ { nodo: [] } ]
      parameters:
        - { name: Vereda-Version, in: header, required: true, schema: { type: string, pattern: "^1\\.[0-9]+$" }, description: "Versión menor en la que viene el evento: la más alta que comparten emisor y receptor según sus .well-known." }
      requestBody: { content: { application/json: { schema: { $ref: "esquemas/evento.json" } } } }
      responses:
        "202": { description: "Aceptado. Un evento repetido (mismo id, mismo contenido) se acepta de nuevo sin volver a aplicarlo." }
        "400": { description: "version_no_soportada; detalle.versiones trae las que el receptor acepta. No se reintenta igual: se reenvía en una versión común o se abandona.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "401": { description: "firma_invalida, clave_desconocida o clave_comprometida. No se reintenta.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "409": { description: "secuencia_fuera_de_orden (detalle.ultima_secuencia dice desde dónde reenviar), o un id ya visto con otro contenido.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
        "429": { $ref: "#/components/responses/Reintentar" }
        "503": { $ref: "#/components/responses/Reintentar" }

components:
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    idem: { name: Idempotency-Key, in: header, required: true, schema: { type: string }, description: Reintentar nunca duplica }
    ifNoneMatch: { name: If-None-Match, in: header, schema: { type: string }, description: "El ETag de la última respuesta. Si el recurso no cambió, el nodo responde 304 sin cuerpo." }
  headers:
    ETag: { description: "Validador de la representación. Toda lectura pública lo lleva.", schema: { type: string } }
    CacheControl: { description: "Siempre `public`: lo público se lee sin token y puede guardarlo cualquier caché intermedia. El tiempo de frescura (`max-age`) lo fija cada nodo; quien necesita el dato al día revalida con `If-None-Match`.", schema: { type: string } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
    Reintentar: { description: "Ahora no. El emisor reintenta, respetando Retry-After si viene.", headers: { Retry-After: { schema: { type: integer }, description: Segundos } } }
    CarritoVencido: { description: "El carrito venció (24 h sin cambios). Código carrito_vencido.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
    NoEsElDueno: { description: "No es el dueño del comercio (código no_es_el_dueno), o el mandato no trae el scope 'administrar'.", content: { application/json: { schema: { $ref: "esquemas/error.json" } } } }
    SinCambios: { description: Sin cambios desde el ETag enviado, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } } }
  securitySchemes:
    sesion: { type: http, scheme: bearer, description: "Token de sesión. Se obtiene en /acceso: firmando un desafío con la clave propia, o con un código por mensaje si el nodo custodia la clave (docs/acceso.md)" }
    mandato:
      type: oauth2
      description: Agentes. Los scopes son los de esquemas/mandato.json.
      flows:
        authorizationCode:
          authorizationUrl: https://vereda.ar/oauth/autorizar
          tokenUrl: https://vereda.ar/oauth/token
          scopes: { leer: Leer, armar: Armar carritos y listas, hablar: Responder en pedidos activos, suscribir: Suscripciones, pedir: "Confirmar pedidos hasta el tope del mandato", repartir: "Repartir en nombre de un repartidor: perfil, disponibilidad, ubicación, viajes, retiro, entrega, cobro del envío, historial y ganancias. Nunca sirve para comprar ni para administrar un comercio", administrar: "Administrar un comercio propio: ficha, catálogo, promociones, stock, pedidos, métricas y exportación. Nunca sirve para comprar" }
    nodo: { type: http, scheme: bearer, description: Firma HTTP entre nodos (RFC 9421) con la clave del nodo emisor }
  schemas:
    Nodo:
      type: object
      properties:
        nodo: { type: string }
        nombre: { type: string }
        versiones: { type: array, items: { type: string } }
        clave_publica: { type: string, description: "La clave activa del nodo. Es el keyid de sus firmas HTTP (RFC 9421)." }
        claves: { $ref: "esquemas/comunes.json#/$defs/claves" }
        operador: { type: string }
        zona: { $ref: "esquemas/comunes.json#/$defs/poligono" }
        endpoints: { type: object, properties: { api: { type: string }, mcp: { type: string }, federacion: { type: string } } }
        codigo_fuente: { type: string, format: uri }
        acceso: { $ref: "esquemas/acceso.json#/$defs/capacidades", description: "Cómo se entra a este nodo (docs/acceso.md). Una app que habla con cualquier nodo mira esto antes de ofrecer la entrada." }
        vinculaciones: { type: array, uniqueItems: true, items: { $ref: "esquemas/comunes.json#/$defs/tipo_vinculacion" }, description: "Los tipos de vinculación que este nodo sabe comprobar (docs/identidad-y-verificacion.md). Un nodo sin canal de WhatsApp, por ejemplo, no lista 'whatsapp'." }
        sostenimiento: { $ref: "esquemas/sostenimiento.json", description: "Cómo se sostiene el nodo, en público (docs/sostenimiento.md). Lo mismo que GET /sostenimiento." }
        tarifa_envio: { type: array, description: "Pública, por tramo de distancia. La fija la cooperativa de repartidores; la red solo la publica y la aplica (docs/ranking-y-despacho.md).", items: { type: object, required: [hasta_km, monto], properties: { hasta_km: { type: number }, monto: { $ref: "esquemas/comunes.json#/$defs/monto" } } } }
    Carrito: { $ref: "esquemas/carrito.json" }
    ConstanciaRendicion:
      type: object
      required: [monto]
      description: |
        Lo que se declara (`rendida`) o se confirma (`recibida`). El nodo arma la constancia
        `pedido.json#/$defs/constancia_rendicion` con la acción de la ruta, el id del pedido, el
        actor (el repartidor, o el comercio del pedido), este `monto` y el instante de la firma, y
        la guarda entera. Con la clave en el teléfono, `firma` va sobre ese objeto: `actor` =
        `firmante`, `instante` = el de la firma; `firmante` distinto del actor, o `instante` a más
        de 5 minutos del reloj del nodo, 422 `firma_invalida`. Vector:
        `ejemplos/vectores-firma.json` → `rendicion-rendida`.
      properties:
        monto: { $ref: "esquemas/comunes.json#/$defs/monto" }
        firma: { $ref: "esquemas/comunes.json#/$defs/firma" }
    FirmaTraspaso:
      description: |
        La firma del repartidor al retirar o entregar, cuando la clave vive en su teléfono: Ed25519
        sobre el JCS (RFC 8785) de `pedido.json#/$defs/traspaso`, `{accion, pedido_id, repartidor,
        instante}`, con `repartidor` = `firmante` e `instante` = el de la firma. El nodo rearma el
        traspaso con la acción de la ruta, el id del pedido y la identidad de la sesión, y corre los
        pasos de docs/claves-y-firmas.md contra el historial del repartidor. `firmante` distinto de
        quien actúa, o `instante` a más de 5 minutos del reloj del nodo: 422 `firma_invalida`.
        Vector: `ejemplos/vectores-firma.json` → `traspaso-entrega`.
      allOf: [ { $ref: "esquemas/comunes.json#/$defs/firma" } ]
    AporteComercio:
      type: object
      required: [aporte_nodo, pagos]
      properties:
        aporte_nodo: { $ref: "esquemas/comercio.json#/properties/aporte_nodo" }
        sugerido: { type: object, description: "Lo que sugiere el nodo, copiado de 'sostenimiento'. Ausente si no sugiere nada.", properties: { por_pedido: { $ref: "esquemas/comunes.json#/$defs/monto" }, mensual: { $ref: "esquemas/comunes.json#/$defs/monto" } } }
        pagos: { type: array, description: "Los 'aporte_nodo' de este comercio, el más reciente primero: pendientes con sus instrucciones, confirmados y vencidos.", items: { $ref: "esquemas/pago.json" } }
    ReclamoAbierto:
      type: object
      required: [reclamo]
      properties:
        reclamo: { $ref: "esquemas/reclamo.json" }
        publicar: { type: string, pattern: "^vereda:prueba=[A-Za-z0-9_-]{22}$", description: "El texto a publicar en la vinculación reclamada. Ausente en 'local' y 'whatsapp'." }
        donde: { type: string }
        qr: { type: string, description: "Solo 'local': el QR del reclamo para imprimir en la ubicación de la ficha. Se muestra esta única vez." }
    VinculacionDeclarada:
      type: object
      required: [vinculacion]
      properties:
        vinculacion: { $ref: "esquemas/comunes.json#/$defs/vinculacion" }
        publicar: { type: string, pattern: "^vereda:prueba=[A-Za-z0-9_-]{22}$", description: "El texto a publicar donde dice 'donde'. Ausente en 'local', 'whatsapp' (va por desafío) y 'cuenta_cobro'." }
        donde: { type: string, description: "Dónde publicarlo, en una frase: 'Un registro TXT en _vereda.lahuerta.com.ar'." }
        qr: { type: string, description: "Solo 'local': el contenido del QR a imprimir, 'vereda:presencia?actor=…&vinculacion=…&s=<secreto>'. Se muestra esta única vez." }
    SaldoPuntos:
      type: object
      required: [comercio, saldo, actualizado, firma]
      properties:
        comercio: { $ref: "esquemas/comunes.json#/$defs/identidad" }
        saldo: { type: integer, minimum: 0 }
        proximo_vencimiento: { type: object, properties: { puntos: { type: integer }, fecha: { type: string, format: date } } }
        actualizado: { $ref: "esquemas/comunes.json#/$defs/instante" }
        firma: { $ref: "esquemas/comunes.json#/$defs/firma", description: "Del comercio. El usuario guarda la última: es su comprobante si el comercio cambia de nodo o desconoce el saldo." }
    MiComercio:
      type: object
      description: "Resumen de un comercio que administro. La ficha entera está en `verComercio`."
      required: [id, identidad, nombre, tipo, abierto_ahora]
      properties:
        id: { type: string, description: "El id de las rutas /comercios/{id}." }
        identidad: { $ref: "esquemas/comunes.json#/$defs/identidad" }
        nombre: { type: string, maxLength: 120 }
        tipo: { $ref: "esquemas/comercio.json#/properties/tipo" }
        abierto_ahora: { $ref: "esquemas/comercio.json#/properties/abierto_ahora", description: "El mismo valor que la ficha: `apertura_manual` si está vigente, si no `horarios`." }
    PaginaDePedidos:
      type: object
      required: [pedidos]
      properties:
        pedidos: { type: array, items: { $ref: "esquemas/pedido.json" } }
        cursor_siguiente: { type: string, description: "Ausente cuando no hay más páginas. Opaco: se manda tal cual en 'cursor'." }
    PaginaDeResultados:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          items:
            type: object
            required: [oferta, comercio, distancia_km]
            properties:
              oferta: { $ref: "esquemas/oferta.json" }
              comercio: { $ref: "esquemas/comercio.json" }
              distancia_km: { type: number }
        cursor_siguiente: { type: string, description: "Ausente cuando no hay más páginas. Opaco: se manda tal cual en 'cursor'." }
    PaginaDeViajes:
      type: object
      required: [viajes]
      properties:
        viajes: { type: array, items: { $ref: "esquemas/viaje.json" } }
        cursor_siguiente: { type: string, description: "Ausente cuando no hay más páginas. Opaco: se manda tal cual en 'cursor'." }
    ExportacionComercio:
      type: object
      description: "Todo lo del comercio en un solo documento firmado por el nodo. Los pedidos van con los datos personales que el comercio todavía conserva según su propia política ('datos.retencion_dias'); lo ya vencido sale anonimizado."
      required: [comercio, exportado, firma]
      properties:
        comercio: { $ref: "esquemas/comercio.json" }
        ofertas: { type: array, items: { $ref: "esquemas/oferta.json" } }
        promociones: { type: array, items: { $ref: "esquemas/promocion.json" } }
        stock: { type: array, items: { type: object, properties: { oferta_id: { type: string }, variante_id: { type: string }, stock: { type: number }, disponible: { type: boolean }, precio_centavos: { type: integer } } } }
        pedidos: { type: array, items: { $ref: "esquemas/pedido.json" } }
        resenas: { type: array, items: { $ref: "esquemas/resena.json" }, description: "Las recibidas. Van firmadas por su autor: valen igual en otro nodo." }
        metricas: { $ref: "esquemas/comercio.json#/$defs/metricas" }
        exportado: { $ref: "esquemas/comunes.json#/$defs/instante" }
        firma: { $ref: "esquemas/comunes.json#/$defs/firma", description: "Del nodo, sobre el JCS del documento sin este campo (docs/claves-y-firmas.md)." }
    Resolucion:
      type: object
      properties:
